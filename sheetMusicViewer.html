<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Sheet Music Viewer</title>

    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        #viewer {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .segment {
            width: 100%;
            height: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #top {
            border-bottom: 2px solid black;
            box-sizing: border-box;
        }

        .segment img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
    </style>    
</head>

<body>
    <div id="viewer">
        <div id="top" class="segment">
        </div>

        <div id="bottom" class="segment">
        </div>
    </div>

    <script>
        function setPages(topSvg, bottomSvg) {
            document.getElementById("top").innerHTML =
                `<img src="svgs/${topSvg}">`;

            document.getElementById("bottom").innerHTML =
                `<img src="svgs/${bottomSvg}">`;
        }
    </script>
</body>
</html>
